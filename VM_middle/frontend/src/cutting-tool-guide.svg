<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Cutting Tools APT Guide</title>
  <desc id="desc">A cutting tool guide with field descriptions and a tool geometry sketch.</desc>
  <rect width="920" height="520" rx="24" fill="#ffffff"/>
  <rect x="18" y="18" width="884" height="484" rx="20" fill="#f8fafc" stroke="#d9e0ea" stroke-width="2"/>

  <text x="48" y="78" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#101828">
    Cutting Tools APT
  </text>

  <g font-family="Inter, Arial, sans-serif" font-size="22" fill="#27364a">
