    <text x="48" y="194"><tspan font-weight="700">Rad</tspan><tspan dx="10">cutter radius</tspan></text>
    <text x="48" y="246"><tspan font-weight="700">eDis</tspan><tspan dx="10">radial corner offset</tspan></text>
    <text x="48" y="298"><tspan font-weight="700">fDis</tspan><tspan dx="10">axial corner offset</tspan></text>

    <text x="396" y="142"><tspan font-weight="700">bangl</tspan><tspan dx="10">tip angle</tspan></text>
    <text x="396" y="194"><tspan font-weight="700">sangl</tspan><tspan dx="10">flank angle</tspan></text>
    <text x="396" y="246"><tspan font-weight="700">Len</tspan><tspan dx="10">cutter height</tspan></text>
    <text x="396" y="298"><tspan font-weight="700">flut</tspan><tspan dx="10">flut number</tspan></text>
  </g>

